<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maxey0 dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#f5f4ef;--surface-1:#efeee8;--surface-2:#fff;--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.22);--border-accent:#378add;--bg-accent:#e6f1fb;--text-accent:#185fa5;--bg-danger:#fcebeb;--text-danger:#a32d2d;--bg-warning:#faeeda;--text-warning:#854f0b;--bg-success:#eaf3de;--text-success:#3b6d11;--radius:8px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--surface-0:#1f1e1d;--surface-1:#2a2927;--surface-2:#30302e;--text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#888780;--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.24);--border-accent:#85b7eb;--bg-accent:#0c447c;--text-accent:#b5d4f4;--bg-danger:#791f1f;--text-danger:#f7c1c1;--bg-warning:#633806;--text-warning:#fac775;--bg-success:#27500a;--text-success:#c0dd97}}
body{margin:0 auto;max-width:720px;padding:16px;background:var(--surface-0);color:var(--text-primary);font:16px/1.6 system-ui,sans-serif}
button{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
input,select,textarea{font:inherit;font-size:14px;color:var(--text-primary);background:var(--surface-2);border:.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 8px}
#copied{position:sticky;bottom:8px;display:none;background:var(--bg-accent);color:var(--text-accent);padding:8px 12px;border-radius:var(--radius);font-size:14px}
</style></head><body>
<script>
function sendPrompt(t){var n=document.getElementById("copied");var done=function(){n.textContent="Command copied. Paste it into your Claude session.";n.style.display="block"};
if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,function(){window.prompt("Copy this command into your Claude session:",t)});else window.prompt("Copy this command into your Claude session:",t)}
</script>
__WIDGET__
<div id="copied" role="status"></div>
</body></html>
